# ok-prompt.stern.workers.dev: the built site (dist/) served as static
# assets, and worker/index.ts relaying the modem cartridge's telnet calls
# (/relay) to the BBSes in src/phonebook.ts. Deploy with `npm run deploy`.
name = "ok-prompt"
main = "worker/index.ts"
compatibility_date = "2026-10-21"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the relay runs the Worker script; everything else is static.
run_worker_first = ["/relay"]
